################################################################################
# Substitutions
################################################################################

substitutions:
  #Webview Initial
  initial_url: "http://192.168.0.x/home/overview"
  
  # Voice assistant phase IDs
  voice_assist_not_ready_phase_id: "0"
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_error_phase_id: "5"
  voice_assist_muted_phase_id: "6"
  voice_assist_timer_finished_phase_id: "7"  

################################################################################
# Board & framework
################################################################################

esphome:
  name: elecrow-advanced-hmi-7
  friendly_name: Elecrow_Advanced_HMI_7
  build_flags: 
    - "-DBOARD_HAS_PSRAM"                                  # Enable PSRAM support in compilation 

  on_boot:
    priority: -100
    then:  
          
      # Screen Brightness (0 - 245)
      - lambda: |-          
          uint8_t cmd[1] = { 0 };
          id(bus_a).write(0x30, cmd, 1);

      # Speaker Amplifier On  (249 = Off)  
      - lambda: |-          
          uint8_t cmd[1] = { 248 };
          id(bus_a).write(0x30, cmd, 1);  
        
      # Web View Client  
      - lambda: |-
          if ( !id(rwv).open_url( "${initial_url}" ) ) {
          id(rwv).set_url("${initial_url}");
          ESP_LOGI("remote_webview", "URL queued (not connected): ${initial_url}");
          }  
      # Force Webview To Showw
      - delay: 5s
      - lambda: |-
          id(rwv).open_url("about:blank");
          delay(200); 
          id(rwv).open_url("${initial_url}");        
          
      - script.execute: about_blank_stuck
        
      - script.execute: draw_display
      # Inactive Screen Initial Values
      - lambda: |-
          // Fetch the current slider percentage value (30 to 100)
          float pct = id(sd_backlight_brightness).state;
          
          // Invert the math: 100% -> 0 (Full Bright), 0% -> 245 (Off)
          uint8_t target_val = (uint8_t)(245.0 * (1.0 - (pct / 100.0)));
          
          uint8_t cmd[1] = { target_val };
          id(bus_a).write(0x30, cmd, 1);
          
      - script.execute: about_blank_stuck       
        
      - delay: 30s
        
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display       
          
esp32:                                                       # ESP32 specific hardware configuration
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz  
  framework: 
    type: esp-idf                                            # Use official ESP-IDF framework, not Arduino
    advanced:   
      execute_from_psram: true      
    sdkconfig_options:
      CONFIG_FATFS_LFN_STACK: "y"
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y                 # Set CPU frequency to max (240MHz)
      CONFIG_ESP32S3_DATA_CACHE_64KB: y                      # Allocate 64KB for data cache
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y                    # Allow instruction fetch from SPIRAM
      CONFIG_SPIRAM_RODATA: y                                # Store read-only data in SPIRAM
      CONFIG_SPIRAM_USE: y                                   # Enable external SPIRAM globally
      CONFIG_SPIRAM_SPEED_80M: y                             # Set SPIRAM clock speed to 80MHz
      CONFIG_SPIRAM_MODE_OCT: y                              # Use Octal mode for faster RAM access
      CONFIG_SPIRAM_SUPPORT: y
      CONFIG_ESP32S3_SPIRAM_SUPPORT: y                       # Enable ESP32-S3 specific SPIRAM support
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
    components:
      - name: "espressif/esp_websocket_client"
        ref: 1.5.0
      - name: "bitbank2/jpegdec"
        source: https://github.com/strange-v/jpegdec-esphome
  variant: esp32s3                                           # Specify the chip variant exactly    
  
psram:                                                       # Physical PSRAM configuration block
  mode: octal                                                # Octal SPI mode matches board layout
  speed: 80MHz                                               # 80MHz speed matches sdkconfig options

################################################################################
# Core services
################################################################################

# Enable logging
logger:
  hardware_uart: UART0  

# Enable Home Assistant API
api:
  encryption:
    key: "14bI+bVdoDi1ta6bYCZDu9F6KQNWrZNOWBloFqbDmVA="

ota:
  - platform: esphome
    password: "2f9d5f76dae10035c0774cf82aedd357"   

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.0.x
    gateway: 192.168.0.1
    subnet: 255.255.255.0  

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "wifi-ssid"
    password: xxxxxxxxxxxx

################################################################################
# WebView
################################################################################     
    
external_components:
  - source: github://strange-v/RemoteWebViewClient@main
    refresh: 0s
    components: [ remote_webview ] 

################################################################################
# Captive Portal
################################################################################   
    
captive_portal:

################################################################################
# I2C bus
################################################################################    

i2c:
  - id: bus_a
    sda: 15
    scl: 16
    scan: true

################################################################################
# I2S
################################################################################   
  
i2s_audio:
  - id: i2s_audio_bus 
    i2s_lrclk_pin: 6      # SPK I2S_LRCLK
    i2s_bclk_pin: 5       # SPK I2S_BCLK

  - id: i2s_mic
    i2s_lrclk_pin: 19      # MIC_WS
    i2s_bclk_pin: 2      # MIC_CLK    

microphone:
  - platform: i2s_audio
    id: pdm_microphone
    i2s_audio_id: i2s_mic
    i2s_din_pin: 20       # MIC_SD
    adc_type: external
    pdm: True  
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: left
    
speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_audio_bus    
    dac_type: external
    i2s_dout_pin: 4
    sample_rate: 44100
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 100ms
    timeout: 500ms
    
media_player:
  - platform: speaker
    name: "Advanced Screen Speaker Media Player"
    id: speaker_media_player
    announcement_pipeline:
      speaker: speaker_out
      format: FLAC
      sample_rate: 44100  
      num_channels: 1   
##### VA ######
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    on_announcement:
      - lambda: |-
          uint8_t cmd[1] = { 248 };
          id(bus_a).write(0x30, cmd, 1);         
      - delay: 400ms
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
            - if:
                condition:
                  - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - wait_until:
                      - not:
                          voice_assistant.is_running:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - script.execute: draw_display   
          
################################################################################
# Switches
################################################################################  
          
switch:       
  - platform: template
    name: "Backlight Power"
    id: backlight_switch
    turn_on_action:
      - lambda: |-
          uint8_t cmd[1] = { 0 };
          id(bus_a).write(0x30, cmd, 1);
    turn_off_action:
      - lambda: |-
          uint8_t cmd[1] = { 245 };
          id(bus_a).write(0x30, cmd, 1);   

  - platform: template
    name: "Speaker Amplifier"
    id: amp_switch
    turn_on_action:
      - lambda: |-
          uint8_t cmd[1] = { 248 };
          id(bus_a).write(0x30, cmd, 1);
    turn_off_action:
      - lambda: |-
          uint8_t cmd[1] = { 249 };
          id(bus_a).write(0x30, cmd, 1);

  - platform: template
    name: "Buzzer"
    id: buzzer_switch
    turn_on_action:
      - lambda: |-
          uint8_t cmd[1] = { 246 };
          id(bus_a).write(0x30, cmd, 1);
    turn_off_action:
      - lambda: |-
          uint8_t cmd[1] = { 247 };
          id(bus_a).write(0x30, cmd, 1);          
          
##### VA #####
  - platform: template
    name: Stream
    optimistic: true
    on_turn_on:
      - microphone.capture:    
    on_turn_off:
      - microphone.stop_capture:   

  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};  
    on_turn_on:
      - microphone.mute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - lambda: |-
          id(speaker_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
            .set_announcement(true)
            .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - media_player.stop:
          announcement: true  
    on_turn_on:
      - lambda: |-
          id(speaker_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
            .set_announcement(true)
            .perform();
          id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);         
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true    
      - delay: 15min
      - switch.turn_off: timer_ringing

################################################################################
# Select
################################################################################
        
select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id} || id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start
                          
################################################################################
# Screen Inactivity - Number
################################################################################ 
                          
number:
  - platform: template
    name: "Backlight Brightness"
    id: sd_backlight_brightness
    optimistic: true
    restore_value: true
    min_value: 30
    max_value: 100
    initial_value: 70
    step: 5
    set_action:
      then:
        - lambda: |-
            // The incoming float value from the slider (30 to 100)
            float pct = 30;
            
            // Invert the math: 100% -> 0 (Bright), 0% -> 245 (Off)
            uint8_t target_val = (uint8_t)(245.0 * (1.0 - (pct / 100.0)));
            
            uint8_t cmd[1] = { target_val };
            id(bus_a).write(0x30, cmd, 1);
        - script.execute: inactivity_timer
                          
################################################################################
# VA Globals
################################################################################                          
                          
globals:
  - id: counter
    type: int
    restore_value: no
    initial_value: '0'
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: global_first_active_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: global_is_timer_active
    type: bool
    restore_value: false
  - id: global_first_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: global_is_timer
    type: bool
    restore_value: false   
    
################################################################################
# VA Image
################################################################################
            
image:
  - platform: file
    file: images/listening_320_240.png
    id: widget_listening
    type: RGB565
    transparency: alpha_channel

################################################################################
# LVGL - Widget
################################################################################    

lvgl:

  align: CENTER
  width: 320
  height: 240
  bg_color: black

  displays: main_display
  buffer_size: 100%

  disp_bg_color: black
  
  bottom_layer:
    align: CENTER
    width: 320
    height: 240
    bg_color: black

  pages:
    align: CENTER
    width: 320
    height: 240
    bg_color: black
    widgets:    
      - image:
          id: popup_image
          src: widget_listening
          bg_color: black
          align: CENTER
          width: 320
          height: 240
          hidden: true
    
################################################################################
# Display — MIPI - 800×480
################################################################################  
  
display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    
    color_order: RGB
    invert_colors: true
    
    update_interval: 16ms
    auto_clear_enabled: false
    
    dimensions:
      width: 800
      height: 480
      
    de_pin: 42
    hsync_pin: 40
    vsync_pin: 41
    pclk_pin: 39
    
    pclk_frequency: 16MHz
    
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    
    data_pins:
      red: [7, 17, 18, 3, 46]
      green: [9, 10, 11, 12, 13, 14]
      blue: [21, 47, 48, 45, 38]   

################################################################################
# Touchscreen — GT911 capacitive, I²C
################################################################################    
    
touchscreen:                                                 # Touch digitizer configuration
  platform: gt911                                            # Driver for Goodix GT911 controllers
  id: my_touchscreen                                         # Internal ID for LVGL touch input
  i2c_id: bus_a                                              # Connect to the configured I2C bus_a
  display: main_display                                      # Link touch input to the main display
  update_interval: 50ms                                      # Poll touch events every 20 milliseconds
  transform: 
    mirror_x: false                                          # Do not invert X-axis coordinates
    mirror_y: false                                          # Do not invert Y-axis coordinates
    swap_xy: false                                           # Do not swap X and Y axes
  on_touch:
    then:
      - script.execute: inactivity_timer    
      
################################################################################
# Remote Webview
################################################################################    
    
remote_webview:
  id: rwv
  server: 192.168.0.x:8081
  url: http://192.168.0.x/home/overview  # set url: "self-test" to initiate the self-test
  full_frame_tile_count: 1
  every_nth_frame: 1
  max_bytes_per_msg: 61440
  min_frame_interval: 64
  jpeg_quality: 65
  big_endian: true
  on_frame_update:
    then:
      - script.execute: inactivity_timer
  current_url_sensor:
    id: current_url_sensor_id
    name: "Remote Display Current URL"
    on_value:
      - logger.log:
          format: "The screen just navigated to: %s"
          args: [ 'x.c_str()' ]

text:
  - platform: template
    id: rwv_url
    name: "URL"
    optimistic: true
    restore_value: false
    mode: TEXT
    min_length: 1
    set_action:
      - lambda: |-
          if (!id(rwv).open_url(std::string(x.c_str()))) {
            id(rwv).set_url(std::string(x.c_str()));
            ESP_LOGI("remote_webview", "URL queued (not connected): %s", x.c_str());
          }             

################################################################################
# VA
################################################################################
              
micro_wake_word:
  id: mww
  models:
    - okay_nabu
    - hey_mycroft
    - hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: pdm_microphone
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
  on_stt_end:
    - script.execute: draw_display
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
  on_tts_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: draw_display
  on_end:
    # Wait a short amount of time to see if an announcement starts
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    # Announcement is finished and the I2S bus is free
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    # Restart only mWW if enabled; streaming wake words automatically restart
    - if:
        condition:
          - lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
          - script.execute: draw_display
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display
  on_timer_started:
    - script.execute: draw_display
  on_timer_cancelled:
    - script.execute: draw_display
  on_timer_updated:
    - script.execute: draw_display
  on_timer_tick:
    - script.execute: draw_display
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - wait_until:
        media_player.is_announcing:
    - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};
    - script.execute: draw_display

  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'

################################################################################
# Scripts
################################################################################ 
          
script:
          
# Webview Start Fix ############################################################
  - id: about_blank_stuck
    mode: restart
    then:
      - delay: 30s
      - if: 
          condition:
            lambda: |-
              std::string server_url = id(current_url_sensor_id).state;
              ESP_LOGI("remote_webview", "URL Sensor Text:%s. Empty:%d. Length:%d.", server_url.c_str(), server_url.empty(), server_url.length() );
              return (server_url.empty() || server_url.length() < 10 || server_url == "unknown" || server_url == "Unknown" );
          then:
            - logger.log: "Current displayed URL is 'Unknown', let's attempt to set it again."
            - lambda: |-
                if ( !id(rwv).open_url( "${initial_url}" ) ) {
                  id(rwv).set_url("${initial_url}");
                  ESP_LOGI("remote_webview", "URL queued (not connected): ${initial_url}");
                }
          else:
            - logger.log: "Initial page load seems to have worked correctly."  

# VA ################################################################################             
  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;

  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

  - id: fetch_first_active_timer
    then:
      - lambda: |
          const auto timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &t : timers) {
            if (t.is_active && t.seconds_left <= output_timer.seconds_left) {
              output_timer = t;
            }
          }
          id(global_first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      - lambda: |
          const auto timers = id(va).get_timers();
          bool output = false;
          if (timers.size() > 0) {
            for (const auto &t : timers) {
              if (t.is_active) {
                output = true;
              }
            }
          }
          id(global_is_timer_active) = output;

  - id: fetch_first_timer
    then:
      - lambda: |
          const auto timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &t : timers) {
            if (t.seconds_left <= output_timer.seconds_left) {
              output_timer = t;
            }
          }
          id(global_first_timer) = output_timer;

  - id: check_if_timers
    then:
      - lambda: |
          const auto timers = id(va).get_timers();
          bool output = false;
          if (timers.size() > 0) {
            output = true;
          }
          id(global_is_timer) = output;

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:    
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:       

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:      
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:      

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};            

  - id: draw_display
    then:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
        - if: { condition: { lambda: 'return id(voice_assistant_phase) == ${voice_assist_listening_phase_id};'  }, then: { lambda: id(widget_show).execute();  } }
        - if: { condition: { lambda: 'return id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};'   }, then: { lambda: id(widget_hide).execute();   } }
        - if: { condition: { lambda: 'return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};'   }, then: { lambda: id(widget_hide).execute();  } }
        - if: { condition: { lambda: 'return id(voice_assistant_phase) == ${voice_assist_error_phase_id};'      }, then: { lambda: id(widget_hide).execute();     } }
        - if: { condition: { lambda: 'return id(voice_assistant_phase) == ${voice_assist_muted_phase_id};'      }, then: { lambda: id(widget_hide).execute();     } }
        - if: { condition: { lambda: 'return id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id};'  }, then: { lambda: id(widget_hide).execute();     } }
        - if: { condition: { lambda: 'return id(voice_assistant_phase) == ${voice_assist_timer_finished_phase_id};' }, then: { lambda: id(widget_hide).execute(); } }

##### VA Widget #####
  - id: widget_show 
    then:
      - lvgl.widget.show: popup_image
          
  - id: widget_hide 
    then:
      - lvgl.widget.hide: popup_image
      - lambda: |-
         id(rwv).open_url("about:blank");
         delay(200); 
         id(rwv).open_url("${initial_url}");

##### Screen Activity #####         
  - id: inactivity_timer
    mode: restart
    then:
      - lambda: |-
          // Get the slider state (assumed 0 to 100)
          float pct = id(sd_backlight_brightness).state;
          
          // Constrain between 0% and 100% to avoid math issues
          if (pct < 0.0) pct = 0.0;
          if (pct > 100.0) pct = 100.0;
          
          // Invert math: 100% -> 0 (Bright), 0% -> 245 (Off)
          uint8_t target_val = (uint8_t)(245.0 * (1.0 - (pct / 100.0)));
          
          uint8_t cmd[1] = { target_val };
          id(bus_a).write(0x30, cmd, 1);
          
      - delay: 10s
      
      - lambda: |-
          float pct = id(sd_backlight_brightness).state;
          
          // Calculate dimmed target (Current % minus 40%)
          float dimmed_pct = pct - 40.0;
          
          // Apply minimum constraint of 30% brightness
          if (dimmed_pct < 30.0) {
            dimmed_pct = 30.0;
          }
          
          // Invert math for the I2C byte
          uint8_t dim_val = (uint8_t)(245.0 * (1.0 - (dimmed_pct / 100.0)));
          
          uint8_t cmd[1] = { dim_val };
          id(bus_a).write(0x30, cmd, 1); 
          